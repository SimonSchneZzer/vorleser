# Baut die Desktop-App für macOS (Apple-Chip) und Windows.
# - bei jedem Push auf main / manuell: Ergebnis unter Actions › Lauf › Artifacts
# - bei einem Tag wie v2.0.1: zusätzlich Veröffentlichung im öffentlichen Repo vorleser-download
#   (Download-Seite https://simonschnezzer.github.io/vorleser-download/). Braucht das Secret
#   DOWNLOAD_REPO_TOKEN: Fine-grained Token mit „Contents: Read and write“ nur für vorleser-download.
name: Desktop-App bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple-Chip (arm64)
            name: mac
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true

      - name: Abhängigkeiten
        run: uv pip install -r requirements.lock      # feste Versionen (aus den requirements*.txt erzeugt)

      - name: Piper-Stimmen (Offline-Ersatz) laden
        run: python -m piper.download_voices --download-dir voices de_DE-thorsten-medium en_US-lessac-medium

      - name: Version aus Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Tests (inkl. Browser-Test mit Chrome)
        run: python -m pytest -q

      - name: Selbsttest (Module laden)
        run: python -c "import server, desktop, clone_setup, updater; print('ok', clone_setup.supported())"

      - name: App bauen (PyInstaller)
        run: pyinstaller --noconfirm --log-level WARN packaging/vorleser.spec

      - name: Selbsttest der fertigen App (HTTPS, ffmpeg, Stimmen, Version)
        run: |
          export VORLESER_HOME="$RUNNER_TEMP/vorleser-selftest"
          if [ "${{ matrix.name }}" = "mac" ]; then APP="dist/Vorleser.app/Contents/MacOS/Vorleser"; else APP="dist/Vorleser/Vorleser.exe"; fi
          set +e; "$APP" --selftest; rc=$?; set -e
          cat "$VORLESER_HOME/data/selftest.txt" || echo "keine Ausgabe"
          exit $rc

      # Markierten Text vorlesen (eigenes Fenster + Notepad) und zweiter Start auf echtem Windows – beides kam
      # bei einem Tester nicht an (11.11.2026): zwei Vorleser liefen gleichzeitig, das Kürzel fand keinen Text.
      - name: Windows – Überall vorlesen + Einzelstart
        if: matrix.name == 'windows'
        run: python packaging/test_ueberall_windows.py dist/Vorleser/Vorleser.exe

      # Export eines vorbereiteten Texts in der gebauten App: „Zusammensetzen“, Größe + Länge wie im Dialog angezeigt
      - name: Export vorbereiteter Texte
        run: |
          if [ "${{ matrix.name }}" = "mac" ]; then APP="dist/Vorleser.app/Contents/MacOS/Vorleser"; else APP="dist/Vorleser/Vorleser.exe"; fi
          python packaging/test_export_app.py "$APP"

      - name: macOS – DMG erstellen
        if: matrix.name == 'mac'
        run: bash packaging/make_dmg.sh

      - name: Windows – Installer erstellen
        if: matrix.name == 'windows'
        run: |
          mkdir -p build
          python -c "from PIL import Image; Image.open('packaging/icon.png').save('build/icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || choco install innosetup -y --no-progress
          "$ISCC" "//DAppVersion=$(cat VERSION)" packaging/vorleser.iss

      # Update auf echtem Windows durchspielen (Teil-Update „Jetzt neu starten“, „Später“ + Beenden, komplettes
      # Paket) – vor jeder Veröffentlichung. Bis 3.0.1 kam die App nach einem Update nie wieder (Rückmeldung David).
      - name: Windows – Update-Test
        if: matrix.name == 'windows'
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          V="$(cat VERSION)"
          cp dist/Vorleser/_internal/VERSION build/VERSION.orig     # Byte für Byte zurück (Dateiliste/Teil-Update!)
          echo -n "9.9.3" > dist/Vorleser/_internal/VERSION      # Testversion fürs komplette Paket, eigener Ordner
          OUT="$(cygpath -w "$PWD/build/updatetest")"             # Windows-Pfad: „//Obuild/…“ reicht Git-Bash falsch weiter
          "$ISCC" "//DAppVersion=9.9.3" "//O$OUT" packaging/vorleser.iss
          cp build/VERSION.orig dist/Vorleser/_internal/VERSION
          python packaging/test_update_windows.py e2e "dist/Vorleser-$V-windows-setup.exe" build/updatetest/Vorleser-9.9.3-windows-setup.exe

      # Teil-Update: Dateiliste mit Prüfsummen + Paket nur mit den Dateien, die sich gegenüber den letzten
      # Versionen geändert haben (macOS erst NACH make_dmg.sh – dort wird das Paket signiert)
      - name: Teil-Update erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(gh release list -R SimonSchneZzer/vorleser-download --limit 5 --exclude-drafts --json tagName -q '.[].tagName' | sed 's/^v//' | tr '\n' ' ')
          echo "Vorversionen: $PREV"
          if [ "${{ matrix.name }}" = "mac" ]; then ROOT="dist/Vorleser.app"; else ROOT="dist/Vorleser"; fi
          python packaging/make_patch.py ${{ matrix.name }} "$ROOT" "$(cat VERSION)" dist/patch $PREV

      - uses: actions/upload-artifact@v4
        with:
          name: Vorleser-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
            dist/patch/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Feste Dateinamen (damit die Links der Download-Seite immer passen)
        run: |
          mv out/Vorleser-mac/*.dmg Vorleser-mac.dmg
          mv out/Vorleser-windows/*-setup.exe Vorleser-windows-setup.exe
          find out -path '*patch*' -type f -exec mv {} . \;      # Dateilisten + Teil-Updates (falls vorhanden)
          ls -la
      - name: Im Download-Repo veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.DOWNLOAD_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Secret DOWNLOAD_REPO_TOKEN fehlt"; exit 1; fi
          VER="${GITHUB_REF_NAME#v}"
          # Notizen aus CHANGELOG.md (Abschnitt „## X.Y.Z“); erste Zeile zeigt die App in der Update-Karte
          awk -v v="## $VER" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then echo "::error::Kein Abschnitt '## $VER' in CHANGELOG.md"; exit 1; fi
          printf '\n---\nDownload and installation notes: https://simonschnezzer.github.io/vorleser-download/\n' >> notes.md
          EXTRA=$(ls Vorleser-*-manifest.json Vorleser-*-patch.zip 2>/dev/null | tr '\n' ' ')
          gh release create "$GITHUB_REF_NAME" Vorleser-mac.dmg Vorleser-windows-setup.exe $EXTRA \
            --repo SimonSchneZzer/vorleser-download --title "Vorleser $VER" --notes-file notes.md
          # latest.json für den Updater der App (Download-Seite, kein Ratenlimit) – erst NACH dem Hochladen,
          # damit eine App nie eine Version meldet, deren Installer noch fehlt
          python3 - "$VER" <<'PY'
          import hashlib, json, os, sys, time
          ver = sys.argv[1]
          base = f"https://github.com/SimonSchneZzer/vorleser-download/releases/download/v{ver}/"
          notes = open("notes.md", encoding="utf-8").read().split("\n---\n")[0].strip()[:600]
          sha = lambda n: hashlib.sha256(open(n, "rb").read()).hexdigest()   # App prüft das komplette Paket damit (ab 3.0.2)
          assets = {n: {"url": base + n, "size": os.path.getsize(n), "sha256": sha(n)} for n in ("Vorleser-mac.dmg", "Vorleser-windows-setup.exe")}
          # Teil-Update je System (nur für die in patch.json genannten Vorversionen; sonst lädt die App alles)
          for plat, n in (("mac", "Vorleser-mac.dmg"), ("windows", "Vorleser-windows-setup.exe")):
              z, info = f"Vorleser-{plat}-patch.zip", f"Vorleser-{plat}-patch.json"
              if os.path.exists(z) and os.path.exists(info):
                  assets[n]["patch"] = {"url": base + z, "size": os.path.getsize(z), "from": json.load(open(info))["from"]}
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump({"version": ver, "published": time.strftime("%Y-%m-%d"), "notes": notes,
                         "page": "https://simonschnezzer.github.io/vorleser-download/",
                         "assets": assets}, f, ensure_ascii=False, indent=2)
          PY
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/SimonSchneZzer/vorleser-download.git" dl
          cp latest.json dl/latest.json
          cd dl
          git config user.name "SimonSchneZzer"
          git config user.email "50883040+SimonSchneZzer@users.noreply.github.com"
          git add latest.json
          git commit -m "latest.json: Vorleser $VER"
          # github.com hakt manchmal (z. B. 504) → sonst wäre das Release online, latest.json aber veraltet
          for i in 1 2 3; do git push && break; [ "$i" = 3 ] && exit 1; sleep $((i * 20)); git pull --rebase -q; done
